
name: Pipeline CI - Calculadora

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./pipeline-calculadora/pipeline-calculadora

    steps:
      - name: 1. Clonar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Instalar dependencias
        run: pip install -r requirements.txt

      - name: 4. Resultado de las pruebas automatizadas
        run: python -m unittest -v

      - name: 5. Construir proyecto
        run: python -m compileall -q .

      - name: 6. Crear paquete
        run: zip calculadora.zip calculadora.py requirements.txt

      - name: 7. Simular despliegue
        run: echo "Despliegue realizado correctamente en ambiente de pruebas"

      - name: 8. Paquete construido y guardado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: paquete-calculadora
          path: pipeline-calculadora/pipeline-calculadora/calculadora.zip
