
name: Pipeline CI - Calculadora

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Clonar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: 3. Ejecutar pruebas
        run: python -m unittest -v

      - name: 4. Construir proyecto
        run: python -m compileall -q .
        
      - name: Crear paquete
        run: zip calculadora.zip calculadora.py

      - name: 5. Simular despliegue
        run: echo "Despliegue realizado correctamente en ambiente de pruebas"
      - name: Guardar paquete construido
        uses: actions/upload-artifact@v4
        with:
          name: paquete-calculadora
          path: calculadora.zip